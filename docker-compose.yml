version: "3.9"
services:
  backend:
    build: ./pepagora-backend
    container_name: pepagora-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./pepagora-backend/.env

  frontend:
    build: ./pepagora-frontend
    container_name: pepagora-frontend
    restart: always
    ports:
      - "7000:7000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
